; =============================================================================
; OUI-SPY Unified Firmware - XIAO ESP32-S3
; =============================================================================

[env:seeed_xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0

; Flash: 8MB QIO, bootloader at 0x0, partitions at 0x8000, app at 0x10000
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB

build_src_filter = +<*> -<raw/>

; =============================================================================
; OUI-SPY Unified Firmware - ESP32 CYD ("Cheap Yellow Display")
; =============================================================================
; Covers the common 2.8"/3.5" CYD boards (plain ESP32-WROOM-32, no native
; USB-CDC, usually no PSRAM). All three share this [env] base and differ only
; in the -DOUISPY_BOARD_* flag (see src/boards.h) that picks the panel size
; and touch controller. PCAP/BLE-SNIFF's session capture buffer auto-falls
; back to regular RAM (smaller) when PSRAM isn't present - no action needed.

[env:cyd_2432s028]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DOUISPY_BOARD_CYD_2432S028
    -Isrc/raw

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0
    lovyan03/LovyanGFX@^1.1.12

; 4MB flash, no PSRAM assumed (see partitions_cyd.csv).
board_build.partitions = partitions_cyd.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB

build_src_filter = +<*> -<raw/>

; 2.8" capacitive-touch variant (CST820/GT911 instead of XPT2046).
[env:cyd_2432s024]
extends = env:cyd_2432s028
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DOUISPY_BOARD_CYD_2432S024
    -Isrc/raw

; 3.5" variant (ILI9488 480x320).
[env:cyd_3248s035]
extends = env:cyd_2432s028
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DOUISPY_BOARD_CYD_3248S035
    -Isrc/raw

; 2.8" dual-USB (micro-USB + USB-C) variant: ST7789 panel, drawn with
; TFT_eSPI (LovyanGFX scrambles its colours). TFT_eSPI is configured entirely
; by these -D flags (USER_SETUP_LOADED); verified on hardware.
[cyd2usb]
tft_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd_2432s028_2usb]
extends = env:cyd_2432s028
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DOUISPY_BOARD_CYD_2432S028_2USB
    ${cyd2usb.tft_flags}
    -Isrc/raw

; Standalone touch/display calibration build: 4 full-screen colored
; quadrants, each a touch button that flashes + prints to Serial. Use this
; to confirm there's no edge clipping and touch maps to the right quadrant
; before chasing the real firmware's layout.
[env:cyd_2432s028_2usb_calib]
extends = env:cyd_2432s028_2usb
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DOUISPY_BOARD_CYD_2432S028_2USB
    -DOUISPY_CALIBRATION_BUILD
    ${cyd2usb.tft_flags}
    -Isrc/raw
